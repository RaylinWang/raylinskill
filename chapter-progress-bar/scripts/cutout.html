<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>抠图</title></head><body>
<!--
  由 prepare_character.mjs 打开，在无头 Chrome 里抠图（所以 macOS / Windows / Linux 都能用）。
  window.cutout(图片地址, 白底阈值) → { png: base64, w, h, blocks }
  1. 从四边泛洪：和边缘连着的白色（或已经透明）的像素都算背景
  2. 剩下的前景按连通块分开，只留最大的一块（周围的装饰小点、动作线就去掉了）
  3. 前景边缘一圈按亮度做柔边，再裁到内容边框（留 6px）
-->
<script>
window.cutout = async (src, thr = 225) => {
  const img = new Image(); img.src = src;
  try { await img.decode(); } catch { throw new Error('这张图打不开（Chrome 不认这个格式？HEIC 要先转成 JPG / PNG）'); }
  const W = img.naturalWidth, H = img.naturalHeight, N = W * H;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0);
  const im = ctx.getImageData(0, 0, W, H), d = im.data;
  const isBg = i => { const o = i * 4; return d[o + 3] < 16 || (d[o] >= thr && d[o + 1] >= thr && d[o + 2] >= thr); };

  // 1. 从边缘泛洪
  const bg = new Uint8Array(N), stack = new Int32Array(N); let sp = 0;
  const push = i => { if (!bg[i] && isBg(i)) { bg[i] = 1; stack[sp++] = i; } };
  for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
  for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
  while (sp) { const i = stack[--sp], x = i % W; if (x > 0) push(i - 1); if (x < W - 1) push(i + 1); if (i >= W) push(i - W); if (i < N - W) push(i + W); }

  // 2. 前景连通块，留最大的
  const lab = new Int32Array(N).fill(-1); let best = -1, bestN = 0, blocks = 0;
  for (let s = 0; s < N; s++) {
    if (bg[s] || lab[s] >= 0) continue;
    const id = blocks++; let n = 0; sp = 0; stack[sp++] = s; lab[s] = id;
    while (sp) {
      const i = stack[--sp], x = i % W; n++;
      if (x > 0 && !bg[i - 1] && lab[i - 1] < 0) { lab[i - 1] = id; stack[sp++] = i - 1; }
      if (x < W - 1 && !bg[i + 1] && lab[i + 1] < 0) { lab[i + 1] = id; stack[sp++] = i + 1; }
      if (i >= W && !bg[i - W] && lab[i - W] < 0) { lab[i - W] = id; stack[sp++] = i - W; }
      if (i < N - W && !bg[i + W] && lab[i + W] < 0) { lab[i + W] = id; stack[sp++] = i + W; }
    }
    if (n > bestN) { bestN = n; best = id; }
  }
  if (best < 0) throw new Error('图里没找到主体（整张都是白的？）');

  // 3. 写透明度、柔边、求边框
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  const keep = i => lab[i] === best;
  for (let i = 0; i < N; i++) {
    const o = i * 4;
    if (!keep(i)) { d[o + 3] = 0; continue; }
    const x = i % W, y = (i / W) | 0;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    const edge = (x > 0 && !keep(i - 1)) || (x < W - 1 && !keep(i + 1)) || (i >= W && !keep(i - W)) || (i < N - W && !keep(i + W));
    if (edge) {
      const lum = (d[o] + d[o + 1] + d[o + 2]) / 3;
      const al = Math.max(0, Math.min(255, (255 - lum) * 255 / Math.max(1, 255 - thr + 40)));
      d[o + 3] = Math.round(d[o + 3] * Math.max(al, 90) / 255);
    }
  }
  ctx.putImageData(im, 0, 0);
  const pad = 6, cx = Math.max(0, x0 - pad), cy = Math.max(0, y0 - pad), cw = Math.min(W, x1 + pad + 1) - cx, chh = Math.min(H, y1 + pad + 1) - cy;
  const out = document.createElement('canvas'); out.width = cw; out.height = chh;
  out.getContext('2d').drawImage(cv, cx, cy, cw, chh, 0, 0, cw, chh);
  return { png: out.toDataURL('image/png').split(',')[1], w: cw, h: chh, blocks };
};
</script></body></html>
